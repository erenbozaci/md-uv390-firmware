name: Build firmware

on:
  push:
    branches: [main]
    tags: ['R*-EA4IPW*', 'R*-TA3BZC*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # release job needs to create releases on tag pushes

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MDUV380 (RT3S / MD-UV380)
            platform: MDUV380
            variant: ""
          - name: MDUV380 +10W variant
            platform: MDUV380
            variant: UV380_PLUS_10W
          - name: RT84 / DM-1701
            platform: RT84_DM1701
            variant: DM1701

    env:
      IMG_TAG: opengd77-mduv380-builder:latest
      CONTAINER_ENGINE: docker

    defaults:
      run:
        working-directory: MDUV380_firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (cached) container image
        uses: docker/build-push-action@v6
        with:
          context: MDUV380_firmware
          file: MDUV380_firmware/Containerfile
          tags: ${{ env.IMG_TAG }}
          load: true
          cache-from: type=gha,scope=builder-image
          cache-to: type=gha,scope=builder-image,mode=max

      - name: Derive artifact name
        id: name
        run: |
          if [ -n "${{ matrix.variant }}" ]; then
            echo "out=OpenGD77_${{ matrix.platform }}_${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "out=OpenGD77_${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build firmware (${{ matrix.platform }} ${{ matrix.variant }})
        run: |
          make build \
            CONTAINER_ENGINE=docker \
            PLATFORM=${{ matrix.platform }} \
            VARIANT=${{ matrix.variant }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.out }}
          path: MDUV380_firmware/build/${{ steps.name.outputs.out }}.bin
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/R') && (contains(github.ref, '-EA4IPW') || contains(github.ref, '-TA3BZC'))
    runs-on: ubuntu-latest

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'OpenGD77_*'

      - name: Stage release files
        run: |
          mkdir -p release
          # download-artifact@v4 unpacks each artifact into its own subdir.
          # Rename the bins to the radio names users actually recognise,
          # then sha256 them. Keep these names in sync with the README.
          cp dist/OpenGD77_MDUV380/OpenGD77_MDUV380.bin \
             release/OpenGD77_MD-UV380_RT3S.bin
          cp dist/OpenGD77_MDUV380_UV380_PLUS_10W/OpenGD77_MDUV380_UV380_PLUS_10W.bin \
             release/OpenGD77_MD-UV390_Plus_10W.bin
          cp dist/OpenGD77_RT84_DM1701_DM1701/OpenGD77_RT84_DM1701_DM1701.bin \
             release/OpenGD77_RT84_DM1701.bin
          cd release && sha256sum *.bin > SHA256SUMS && cat SHA256SUMS

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Unofficial build by TA3BZC, a fork of the OpenGD77 source (dual screen, Dual Watch
            options, messaging, experimental DMR SMS).

            **Not affiliated with the OpenGD77 project.** For canonical
            firmware see <https://www.opengd77.com/>.

            ### Which bin do I need?

            | File | Radio |
            |---|---|
            | `OpenGD77_MD-UV390_Plus_10W.bin` | TYT MD-UV390 Plus 10W (and an MD-UV380 / RT3S with the 10W power-amp mod). The one used by the author |
            | `OpenGD77_MD-UV380_RT3S.bin` | TYT MD-UV380 / MD-UV390 (5W), Retevis RT3S (incl. GPS) |
            | `OpenGD77_RT84_DM1701.bin` | Retevis RT-84, Baofeng DM-1701 |

            ### Installing

            These files contain **no AMBE codec**. They have to be flashed with the loader in this
            repository, which patches the codec in from the official TYT MD9600 V26.45 firmware
            (see the README, "Getting started"). Flashing them with another tool gives an FM only radio.

            Verify downloads against `SHA256SUMS`. The DMR SMS code has not been tested on the air.
